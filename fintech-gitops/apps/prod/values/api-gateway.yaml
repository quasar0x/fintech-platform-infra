nameOverride: api-gateway

replicaCount: 2

image:
  repository: 461508717137.dkr.ecr.us-east-1.amazonaws.com/api-gateway
  tag: sha-2ba8769
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 8080

containerPort: 8080

env:
  APP_NAME: "api-gateway"
  ENVIRONMENT: "prod"
  JWT_ISSUER: "fintech-auth"
  JWT_AUDIENCE: "fintech-platform"
  AUTH_SERVICE_URL: "http://auth-service.fintech-prod.svc.cluster.local"
  PAYMENTS_SERVICE_URL: "http://payments-service.fintech-prod.svc.cluster.local"
  USER_SERVICE_URL: "http://user-service.fintech-prod.svc.cluster.local"
  ENABLE_PROXY: "true"

# ✅ Make ONLY api-gateway public via ALB Ingress
ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /healthz

    # ✅ Enable both listeners
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'

    # ✅ Attach ACM certificate (paste from terraform output later)
    alb.ingress.kubernetes.io/certificate-arn: REPLACE_WITH_ACM_CERT_ARN

    # ✅ Redirect all HTTP -> HTTPS
    alb.ingress.kubernetes.io/ssl-redirect: "443"

  hosts:
    - host: api.fintech-platform.dev
      paths:
        - path: /
  tls: []

# ✅ Put JWT_PUBLIC_KEY into a Secret created by Helm
secrets:
  enabled: true
  data:
    JWT_PUBLIC_KEY: |-
      -----BEGIN PUBLIC KEY-----
      MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA02TZQD2lW+kAbNseOsnk
      oonBn4MoBQUrBbyxvptUZ5L0dzIMEnYEFdpND4h3DqxBTNnaOSAbe/qKZ9tUp3kC
      AVyxGLFqef5MLkT/HHypWtbyLWTzFG1ZWOgjbXM5bYF0vhMxSEcBE1Or3ZBNo7g2
      X4Tz7/s+TmYxle/PwNfqNyd2pykMB8NmyVLoHTGk2tZWCZafFm33LU+7aU8SEqac
      2blzWgLyKsTNTNU1MqjmyxJMEKb/YjO5DxKFOUPSiEQfzpH0K/qSASNINX6oOs2Y
      Y2XSc6HipA9Q0767Hwhk5+y+Ap8F9g7DJVF1qGDWnzIfV9jUZmDSqnW6xSGX3Xej
      CQIDAQAB
      -----END PUBLIC KEY-----

readinessProbe:
  enabled: true
  path: /readyz
  initialDelaySeconds: 5
  periodSeconds: 10

livenessProbe:
  enabled: true
  path: /healthz
  initialDelaySeconds: 10
  periodSeconds: 10

extraEnv:
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://otel-collector.observability.svc.cluster.local:4317"
  - name: OTEL_EXPORTER_OTLP_PROTOCOL
    value: "grpc"
  - name: OTEL_SERVICE_NAME
    value: "api-gateway"
  - name: OTEL_RESOURCE_ATTRIBUTES
    value: "deployment.environment=prod"
